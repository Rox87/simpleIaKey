[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
chrono = "0.4.44"
crossbeam-channel = "0.5.15"
enigo = "0.1.3"
env_logger = "0.11.10"
log = "0.4.29"
rdev = "0.5.3"
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["json", "blocking"] }
rust-ini = "0.21.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
dotenvy = "0.15"
